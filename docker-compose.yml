services:
  postgres:
    image: postgres:15-alpine
    container_name: juventud-postgres
    environment:
      POSTGRES_USER: juventud
      POSTGRES_PASSWORD: desarrollo123
      POSTGRES_DB: juventud_guacarhue
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juventud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - juventud-network

  redis:
    image: redis:7-alpine
    container_name: juventud-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - juventud-network

volumes:
  postgres_data:

networks:
  juventud-network:
    driver: bridge

# Para usar: docker-compose up -d
# Para detener: docker-compose down
# Para ver logs: docker-compose logs -f
# Para conectarse a BD: docker exec -it juventud-postgres psql -U juventud -d juventud_guacarhue
